[project]
name = "hackerrank-orchestrate-claims"
version = "0.1.0"
description = "Multimodal evidence review pipeline for HackerRank Orchestrate."
requires-python = ">=3.12"
dependencies = [
    "filetype>=1.2.0",
    "httpx>=0.28.0",
    "openai>=1.93.0",
    "pillow>=11.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
